<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OptiClass Admin</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- ── LOGIN ─────────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
        <rect width="40" height="40" rx="10" fill="#4f46e5"/>
        <path d="M10 28 L20 12 L30 28" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M14 22 L26 22" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <span>OptiClass</span>
    </div>
    <h2>Admin Panel</h2>
    <p class="login-subtitle">Sign in to manage your university schedule</p>
    <form id="login-form">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="login-username" placeholder="Enter username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="Enter password" autocomplete="current-password" required>
      </div>
      <div id="login-error" class="login-error" style="display:none"></div>
      <button type="submit" class="btn btn-primary btn-full" id="login-btn">
        <span id="login-btn-text">Sign In</span>
      </button>
    </form>
  </div>
</div>

<!-- ── APP SHELL ──────────────────────────────────────────── -->
<div id="app-shell" style="display:none">
  <aside id="sidebar">
    <div class="sidebar-header">
      <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
        <rect width="40" height="40" rx="8" fill="#4f46e5"/>
        <path d="M10 28 L20 12 L30 28" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M14 22 L26 22" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <span class="sidebar-brand">OptiClass</span>
    </div>
    <nav id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="sidebar-avatar">A</div>
        <div>
          <div class="user-name" id="sidebar-username"></div>
          <div class="user-role" id="sidebar-role"></div>
          <div id="sidebar-dept" style="font-size:11px;opacity:0.7;margin-top:1px"></div>
        </div>
      </div>
      <button class="btn-logout" id="logout-btn" title="Sign out">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </aside>

  <div id="main-area">
    <header id="topbar">
      <div id="topbar-title">Dashboard</div>
      <div id="topbar-right"></div>
    </header>
    <main id="content">
      <div class="loading-spinner"><div class="spinner"></div></div>
    </main>
  </div>
</div>

<!-- ── MODAL ─────────────────────────────────────────────── -->
<div id="modal-overlay" style="display:none">
  <div id="modal-box">
    <div id="modal-header">
      <span id="modal-title"></span>
      <button id="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div id="modal-body"></div>
    <div id="modal-footer"></div>
  </div>
</div>

<!-- ── TOAST ─────────────────────────────────────────────── -->
<div id="toast-container"></div>

<!-- ── SCRIPTS ───────────────────────────────────────────── -->
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<script src="/static/api.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
